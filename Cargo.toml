[package]
name = "dotbee"
version = "1.0.0"
edition = "2024"
rust-version = "1.96.0"
description = "Dotfiles manager designed for ease of use"
repository = "https://github.com/rogue-sly/dotbee"
license = "MIT"
keywords = ["dotbee", "dotfiles"]
categories = ["command-line-utilities"]
exclude = [".github/*", ".mise-tasks/*", "mise.toml"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides]
x86_64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/dotbee-linux-x86_64" }
aarch64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/dotbee-linux-arm64" }
x86_64-unknown-linux-musl = { pkg-url = "{ repo }/releases/download/v{ version }/dotbee-linux-x86_64-musl" }
aarch64-unknown-linux-musl = { pkg-url = "{ repo }/releases/download/v{ version }/dotbee-linux-arm64-musl" }
aarch64-linux-android = { pkg-url = "{ repo }/releases/download/v{ version }/dotbee-android-arm64" }

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "3.0"
demand = "1.7"
dirs = "6.0"
git2 = { version = "0.21", features = ["cred", "https", "ssh", "vendored-libgit2", "vendored-openssl"] }
indexmap = { version = "2.2", features = ["serde"] }
nix = { version = "0.31", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh-key = "0.6"
toml = { version = "0.9", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
