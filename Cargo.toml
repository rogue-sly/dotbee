[package]
name = "dotbee"
version = "0.7.0"
edition = "2024"
rust-version = "1.96.0"
description = "Dotfiles manager designed for ease of use"
repository = "https://github.com/rogue-sly/dotbee"
license = "MIT"
keywords = ["dotbee", "dotfiles"]
categories = ["command-line-utilities"]
exclude = [".github/*", ".mise-tasks/*", "mise.toml"]

[package.metadata.binstall]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/{ name }-v{ version }-{ target }-musl.tar.gz"
bin-dir = "{bin}"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides]
x86_64-unknown-linux-musl = {
  pkg-url = "{ repo }/-/releases/v{ version }/downloads/{ name }-v{ version }-linux-x64-musl.tar.gz"
}
aarch64-unknown-linux-musl = {
  pkg-url = "{ repo }/-/releases/v{ version }/downloads/{ name }-v{ version }-linux-arm64-musl.tar.gz"
}

[package.metadata.deb]
maintainer = "Rogue.Sly <rogue87@tuta.io>"
copyright = "2026, Rogue.Sly <rogue87@tuta.io>"
license-file = ["LICENSE", "4"]
assets = [["target/release/dotbee", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [
  {
    source = "target/release/dotbee",
    dest = "/usr/bin/dotbee",
    mode = "755"
  },
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "3.0"
demand = "1.7"
dirs = "6.0"
indexmap = { version = "2.2", features = ["serde"] }
nix = { version = "0.31", features = ["fs", "hostname"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.9", features = ["parse"] }

[dev-dependencies]
tempfile = "3"
