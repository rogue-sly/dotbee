# Lefthook configuration for dotbee
# Reference: https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  commands:
    changelog:
      run: "git-cliff -o CHANGELOG.md && git add CHANGELOG.md"

    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all

    tombi:
      glob: "*.toml"
      run: tombi format {staged_files}

    clippy:
      run: cargo clippy --all -- -D warnings

    check:
      run: cargo check --all

