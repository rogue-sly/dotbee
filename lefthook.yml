# Lefthook configuration for dotbee
# Reference: https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all

    tombi:
      glob: "*.toml"
      run: tombi format {staged_files}

    check:
      glob: "*.rs"
      run: cargo check --all

pre-push:
  commands:
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings

    test:
      glob: "*.rs"
      run: cargo test --all
