name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS
          - os: macos-14
            artifact_name: dotbee-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/dotbee
            target: x86_64-apple-darwin
          - os: macos-14
            artifact_name: dotbee-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/dotbee
            target: aarch64-apple-darwin

          # Linux Glibc
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/dotbee
            pkg_arch_deb: amd64
            pkg_arch_rpm: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-arm64
            binary_path: target/aarch64-unknown-linux-gnu/release/dotbee
            pkg_arch_deb: arm64
            pkg_arch_rpm: aarch64
            target: aarch64-unknown-linux-gnu

          # Linux Musl
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-x86_64-musl
            binary_path: target/x86_64-unknown-linux-musl/release/dotbee
            target: x86_64-unknown-linux-musl
            pkg_arch_deb: amd64
            pkg_arch_rpm: x86_64
            linker: ""
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-arm64-musl
            binary_path: target/aarch64-unknown-linux-musl/release/dotbee
            target: aarch64-unknown-linux-musl
            pkg_arch_deb: arm64
            pkg_arch_rpm: aarch64
            linker: aarch64-linux-gnu-gcc

          # Linux Android
          - os: ubuntu-22.04
            artifact_name: dotbee-android-arm64
            binary_path: target/aarch64-linux-android/release/dotbee
            target: aarch64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag format
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Android linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          echo "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Set musl linker for aarch64
        if: matrix.linker != ''
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package .deb
        if: matrix.pkg_arch_deb != ''
        run: |
          mkdir -p dist
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/${{ matrix.artifact_name }}.deb

      - name: Package .rpm
        if: matrix.pkg_arch_rpm != ''
        run: |
          mkdir -p dist
          cargo install cargo-generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/${{ matrix.artifact_name }}.rpm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [changelog, build]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
          pattern: artifacts-*

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum dotbee-* > checksums.txt

      - name: Create Release & Upload Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ github.ref }}
          body: ${{ needs.changelog.outputs.release_body }}
          overwrite: true
          file_glob: true

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
