name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS
          - os: macos-14
            artifact_name: dotbee-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/dotbee
            target: x86_64-apple-darwin
          - os: macos-14
            artifact_name: dotbee-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/dotbee
            target: aarch64-apple-darwin

          # Linux Glibc
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/dotbee
            pkg_arch_deb: amd64
            pkg_arch_rpm: x86_64
            target: "x86_64-unknown-linux-gnu"
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-arm64
            binary_path: target/aarch64-unknown-linux-gnu/release/dotbee
            pkg_arch_deb: arm64
            pkg_arch_rpm: aarch64
            target: aarch64-unknown-linux-gnu


          # Linux Musl
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-x86_64-musl
            binary_path: target/x86_64-unknown-linux-musl/release/dotbee
            target: x86_64-unknown-linux-musl
            pkg_arch_deb: amd64
            pkg_arch_rpm: x86_64
            linker: ""
          - os: ubuntu-22.04
            artifact_name: dotbee-linux-arm64-musl
            binary_path: target/aarch64-unknown-linux-musl/release/dotbee
            target: aarch64-unknown-linux-musl
            pkg_arch_deb: arm64
            pkg_arch_rpm: aarch64
            linker: aarch64-linux-gnu-gcc

          # Linux Android
          - os: ubuntu-22.04
            artifact_name: dotbee-android-arm64
            binary_path: target/aarch64-linux-android/release/dotbee
            target: aarch64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Android linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          echo "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Set musl linker for aarch64
        if: matrix.linker != ''
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build targeted release
        if: matrix.target != '' && matrix.target != 'aarch64-linux-android'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Android release
        if: matrix.target == 'aarch64-linux-android'
        run: cargo build --release --target aarch64-linux-android

      - name: Package .deb
        if: matrix.pkg_arch_deb != ''
        run: |
          mkdir -p dist
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/${{ matrix.artifact_name }}-${{ matrix.pkg_arch_deb }}.deb

      - name: Package .rpm
        if: matrix.pkg_arch_rpm != ''
        run: |
          mkdir -p dist
          cargo install cargo-generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/${{ matrix.artifact_name }}-${{ matrix.pkg_arch_rpm }}.rpm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum dotbee-* > checksums.txt

      - name: Ensure GitHub release exists
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Publish release assets
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
